<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>belajar translasi 2D</title>
    <style>
        .kotak-level-1 {
            width: 150px;
            height: 150px;
            background: color #03045e;
            color: #90e0ef;
            text-align:center;
            line: height 150px;
            border:2px solid #90efcf;
            border: radius 10px;
            transition:transform 2s ease,background-color 2s

        }
        .kotak-level-1:hover{
            transform:translate(100px,50px);
            background-color:#90E0EF;
            color:#03045E;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>praktik level 1:translasi 2D</h3>
        <P>arahkan kursor kedalam kotak untuk melihat elemen bergeser</P>
        <div class="kotak-level-1">geser saya</div>
        <p>Nama:Reyvanno</p>
        <p>kelas:9B</p>
    </div>
    
</body>
</html>
